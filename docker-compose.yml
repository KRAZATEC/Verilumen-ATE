version: '3.8'

services:
  # 1. FastAPI REST Backend API
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: verilumen-backend
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - DEFAULT_CONTAMINATION=0.05
      - PYTHONPATH=/app
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
    command: ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  # 2. Next.js Production UI (Assessment Spec)
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: verilumen-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    depends_on:
      - backend

  # 3. Streamlit Engineering Console (Python Native)
  console:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: verilumen-console
    ports:
      - "8501:8501"
    environment:
      - DEBUG=False
      - PYTHONPATH=/app
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    command: ["streamlit", "run", "backend/app/streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    depends_on:
      - backend

